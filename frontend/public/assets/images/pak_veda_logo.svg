    <path d="M 26 5 C 14 5, 5 14, 5 26 C 5 38, 14 47, 26 47 C 33 47, 39 43, 43 38" stroke="#15472B" stroke-width="1.2" stroke-linecap="round" opacity="0.4" stroke-dasharray="2 3"/>
    
    <!-- Left Olive Leaf (Heritage Forest Green) -->
    <path d="M 26 26 C 18 22, 12 13, 10 2 C 22 4, 30 11, 31 23 C 29.5 24.5, 27.8 25.4, 26 26 Z" fill="#15472B"/>
    <path d="M 14.5 7.5 C 19 12.5, 23.5 18, 27 24" stroke="#FFFFFF" stroke-width="0.85" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Right Herb / Olive Leaf (Fresh Spring Herbal Green) -->
    <path d="M 25 27 C 26 15, 35 6, 50 5 C 49 19, 39 28, 27 28.5 C 23 31.5, 19 35.5, 17 41 C 16 36.5, 19 31, 25 27 Z" fill="#528837"/>
    <path d="M 43 9.5 C 36 14, 30.5 20.5, 25.5 28" stroke="#FFFFFF" stroke-width="0.95" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Golden Cold-Press Botanical Nectar Droplet -->
